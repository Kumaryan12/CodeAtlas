name: CodeAtlas checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Python, migrations and retrieval baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codeatlas
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: codeatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeatlas"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CODEATLAS_DATABASE_URL: postgresql+psycopg://codeatlas:ci_only@localhost:5432/codeatlas
      CODEATLAS_OPENAI_API_KEY: ""
      CODEATLAS_ANTHROPIC_API_KEY: ""
      CODEATLAS_SANDBOX_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install locked API dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.lock
          python -m pip install --no-deps -e apps/api
      - name: Lint and format
        run: |
          ruff check apps/api
          ruff format --check apps/api
      - name: Test application behavior
        run: pytest apps/api/tests -q
      - name: Verify PostgreSQL migrations
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini check
      - name: Record offline lexical retrieval baseline
        run: python -m codeatlas.retrieval.evaluate --offline > evaluation-offline.json
      - run: python -m codeatlas.evaluation.agent --scripted --transport mcp --markdown agent-evaluation.md > agent-evaluation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-evaluations-${{ github.sha }}
          path: |
            evaluation-offline.json
            agent-evaluation.json
            agent-evaluation.md
          if-no-files-found: error
          retention-days: 14

  web:
    name: Frontend tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sandbox:
    name: Real Docker execution boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CODEATLAS_OPENAI_API_KEY: ""
      CODEATLAS_ANTHROPIC_API_KEY: ""
      CODEATLAS_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install locked API dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.lock
          python -m pip install --no-deps -e apps/api
      - name: Build trusted test images
        run: |
          docker build -f sandbox/python.Dockerfile -t codeatlas-sandbox-python:v1 sandbox
          docker build -f sandbox/node.Dockerfile -t codeatlas-sandbox-node:v1 sandbox
      - name: Test actual sandbox restrictions
        run: pytest apps/api/tests/test_sandbox_live.py -q
